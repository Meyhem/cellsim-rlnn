<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CellSim Viewer</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#d7dae0; --muted:#8a90a0; --accent:#6cb6ff; --border:#262a33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  main { display:flex; gap:16px; padding:16px; flex-wrap:wrap; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
  #left { flex:0 1 664px; min-width:0; }
  #right { flex:1 1 360px; min-width:0; }
  canvas { display:block; max-width:100%; height:auto; }
  #dish { width:640px; aspect-ratio:1; }
  #chart { width:100%; cursor:pointer; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .row input[type=range] { flex:1; min-width:0; }
  .row span { min-width:90px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  button, select { background:#222733; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font:inherit; }
  button:hover { border-color:var(--accent); }
  .legend { display:flex; gap:16px; color:var(--muted); margin:6px 0; flex-wrap:wrap; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:6px; }
  pre#info { margin:8px 0 0; color:var(--muted); white-space:pre-wrap; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>CellSim</h1>
  <label>Run <select id="run"></select></label>
  <label><input type="checkbox" id="follow"> Follow latest</label>
</header>
<main>
  <section id="left">
    <canvas id="dish" width="640" height="640"></canvas>
    <div class="controls">
      <button id="play">Play</button>
      <button id="stepBtn" title="Next frame (→)">Step</button>
      <label>Speed
        <select id="speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option>
          <option value="4">4×</option><option value="8">8×</option>
        </select>
      </label>
      <label><input type="checkbox" id="showRays" checked> Rays</label>
      <label><input type="checkbox" id="showTrail" checked> Trail</label>
    </div>
    <label class="row">Frame <input type="range" id="frame" min="0" max="0" value="0"><span id="frameLabel">–</span></label>
    <label class="row">Epoch <input type="range" id="epoch" min="0" max="0" value="0" step="1"><span id="epochLabel">–</span></label>
  </section>
  <section id="right">
    <div class="legend"><span><i style="background:#6cb6ff"></i>train mean score</span><span><i style="background:#f0a35e"></i>eval score (recorded)</span></div>
    <canvas id="chart" width="720" height="360"></canvas>
    <pre id="info"></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
